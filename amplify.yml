# AWS Amplify Hosting build spec.
#
# Everything now lives in ONE Next.js app (apps/labs), served under path
# prefixes on a single domain:
#   /                       -> landing site
#   /mounting-verification  -> Dashcam Mount Analyzer (+ /api/analyze)
#   /dvr-request-flow       -> DVR chat assistant
#
# Deploy as a single Amplify app (Web Compute / SSR) with app root apps/labs.
#
# Env vars (App settings -> Environment variables):
#   AUTH_ISSUER, AUTH_AUDIENCE, AUTH_JWKS_URI, AUTH_LOGIN_URL (required) — used
#     by middleware.ts/master-login to gate the whole site
#   GEMINI_API_KEY (required), GEMINI_MODEL (optional) — used by /api/analyze
#   BACKEND_URL, NEXT_PUBLIC_WS_URL — used by /dvr-request-flow
#   NEXT_PUBLIC_AGENTIC_LISA_CHATBOT_URL — used by /agentic-lisa (iframed
#     chatbot URL, includes its own access token as a query param)
version: 1
applications:
  - appRoot: apps/labs
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@10.24.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Amplify does not expose console env vars to the Next.js SSR runtime.
            # Write the server-side ones to .env.production so Next loads them at
            # runtime. AUTH_* are read at module scope by jwt-verifier.ts (imported
            # by middleware.ts), which Next evaluates while collecting page data
            # during build too, so they must land here before the build command runs.
            - env | grep -e AUTH_ISSUER -e AUTH_AUDIENCE -e AUTH_JWKS_URI -e AUTH_LOGIN_URL -e NEXT_PUBLIC_AGENTIC_LISA_CHATBOT_URL -e GEMINI_API_KEY -e GEMINI_MODEL -e BACKEND_URL -e VIDEORAG_EMBED_TOKEN -e SKIP_AUTH >> .env.production || true
            - npx turbo run build --filter=labs-clone
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
