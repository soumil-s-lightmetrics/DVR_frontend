<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Searching hours of video with a chatbot and surfacing matching clips">
  <defs>
    <linearGradient id="vibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <clipPath id="viframe"><rect x="0" y="0" width="400" height="300" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#viframe)">
    <!-- black backdrop -->
    <rect x="0" y="0" width="400" height="300" fill="url(#vibg)"/>

    <!-- white content panel -->
    <rect x="26" y="26" width="348" height="248" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>

    <!-- search / prompt bar -->
    <rect x="44" y="46" width="312" height="40" rx="20" fill="#f5f5f5" stroke="#d4d4d4" stroke-width="1.5"/>
    <!-- magnifier -->
    <circle cx="66" cy="66" r="7" fill="none" stroke="#111111" stroke-width="2.5"/>
    <line x1="71" y1="71" x2="77" y2="77" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
    <!-- query text -->
    <rect x="88" y="59" width="150" height="6" rx="3" fill="#171717"/>
    <rect x="88" y="70" width="96" height="6" rx="3" fill="#a3a3a3"/>
    <!-- send -->
    <circle cx="338" cy="66" r="13" fill="#111111"/>
    <path d="M332 66 L344 66 M338 60 L344 66 L338 72" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- results label -->
    <rect x="44" y="102" width="120" height="6" rx="3" fill="#a3a3a3"/>

    <!-- matching video clips (3 thumbnails) -->
    <g>
      <!-- clip 1 (highlighted match) -->
      <rect x="44" y="120" width="98" height="66" rx="8" fill="url(#clip)" stroke="#111111" stroke-width="3"/>
      <circle cx="93" cy="153" r="13" fill="#ffffff" opacity="0.95"/>
      <path d="M88 146 L101 153 L88 160 Z" fill="#111111"/>
      <rect x="52" y="174" width="40" height="4" rx="2" fill="#525252"/>

      <!-- clip 2 -->
      <rect x="151" y="120" width="98" height="66" rx="8" fill="url(#clip)"/>
      <circle cx="200" cy="153" r="13" fill="#ffffff" opacity="0.8"/>
      <path d="M195 146 L208 153 L195 160 Z" fill="#404040"/>
      <rect x="159" y="174" width="52" height="4" rx="2" fill="#737373"/>

      <!-- clip 3 -->
      <rect x="258" y="120" width="98" height="66" rx="8" fill="url(#clip)"/>
      <circle cx="307" cy="153" r="13" fill="#ffffff" opacity="0.8"/>
      <path d="M302 146 L315 153 L302 160 Z" fill="#404040"/>
      <rect x="266" y="174" width="46" height="4" rx="2" fill="#737373"/>
    </g>

    <!-- answer line under results -->
    <rect x="44" y="204" width="312" height="46" rx="10" fill="#f5f5f5"/>
    <rect x="58" y="216" width="220" height="6" rx="3" fill="#404040"/>
    <rect x="58" y="230" width="150" height="6" rx="3" fill="#cccccc"/>
  </g>
</svg>
